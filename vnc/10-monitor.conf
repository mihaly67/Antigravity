Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "DPMS" "false"
EndSection

Section "Monitor"
    Identifier "DP-1"
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option "Enable" "true"
    Option "PreferredMode" "1920x1080"
    Option "Primary" "true"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "modesetting"
    Option "Monitor-DP-1" "DP-1"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "DP-1"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
        Modes "1920x1080"
    EndSubSection
EndSection
