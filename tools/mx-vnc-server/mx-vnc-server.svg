<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#0e131b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Monitor Outer Bezel -->
  <rect x="8" y="12" width="112" height="80" rx="10" fill="#232731" stroke="#3a4050" stroke-width="3"/>
  <!-- Monitor Screen -->
  <rect x="14" y="18" width="100" height="68" rx="6" fill="url(#screenGrad)"/>
  <!-- Stand -->
  <rect x="56" y="92" width="16" height="18" fill="#3a4050"/>
  <rect x="36" y="110" width="56" height="8" rx="4" fill="#2b303c"/>
  <!-- VNC Text -->
  <text x="64" y="60" font-family="'DejaVu Sans', 'Noto Sans', sans-serif" font-size="24" font-weight="bold" fill="#5dade2" text-anchor="middle" letter-spacing="2">VNC</text>
  <!-- Status Green Glow LED -->
  <circle cx="102" cy="74" r="10" fill="#2ecc71" opacity="0.35" filter="url(#glow)"/>
  <circle cx="102" cy="74" r="6" fill="#2ecc71" stroke="#ffffff" stroke-width="1.5"/>
</svg>
